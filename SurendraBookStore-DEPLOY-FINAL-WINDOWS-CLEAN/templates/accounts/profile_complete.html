{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5" style="max-width: 600px;">
    <div class="card p-4" style="border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus display-1 text-primary"></i>
            <h2 class="fw-bold mt-2">📝 Complete Your Profile</h2>
            <p class="text-muted">Tell us a bit about yourself</p>
        </div>
        <form method="POST" action="{% url 'accounts:profile_complete' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Full Name</label>
                <input type="text" name="full_name" class="form-control form-control-lg" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Phone Number</label>
                <input type="tel" name="phone" class="form-control form-control-lg" placeholder="Enter phone number" required>
                <small class="text-muted">We'll use this for order updates</small>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Address</label>
                <textarea name="address" class="form-control form-control-lg" rows="2" placeholder="Enter your address" required></textarea>
            </div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">City</label>
                    <input type="text" name="city" class="form-control form-control-lg" placeholder="City" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">State</label>
                    <input type="text" name="state" class="form-control form-control-lg" placeholder="State" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Pincode</label>
                    <input type="text" name="pincode" class="form-control form-control-lg" placeholder="Pincode" required>
                </div>
            </div>
            <button type="submit" class="btn btn-ultra-primary w-100 py-3 mt-3">
                <i class="bi bi-check2-circle me-2"></i>Complete Profile
            </button>
        </form>
    </div>
</div>
{% endblock %}
