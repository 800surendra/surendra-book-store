{% extends "base.html" %}{% block content %}<main class="container py-5"><h1>Notifications</h1>{% for note in notes %}<article class="card p-3 mb-2"><strong>{{ note.title }}</strong><p class="mb-0">{{ note.message }}</p><small class="text-muted">{{ note.created_at }}</small></article>{% empty %}<p>You have no notifications.</p>{% endfor %}</main>{% endblock %}
