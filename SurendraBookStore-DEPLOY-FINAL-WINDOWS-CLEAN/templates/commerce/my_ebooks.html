{% extends "base.html" %}
{% block title %}My E-Books · SurendraBookStore{% endblock %}
{% block content %}<main class="container py-5"><h1>My E-Books</h1><div class="row g-4">{% for access in access_list %}<div class="col-md-4"><article class="card p-3"><h3>{{ access.ebook.title }}</h3><p>{{ access.ebook.author }}</p><a class="btn btn-primary" href="{% url 'commerce:download_ebook' access.ebook_id %}">Download</a></article></div>{% empty %}<p>Your digital library is empty.</p>{% endfor %}</div></main>{% endblock %}
