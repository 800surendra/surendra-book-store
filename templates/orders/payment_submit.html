{% extends 'base.html' %}
{% load static %}
{% csrf_token %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card p-5">
                <h1 class="gold-title">📤 Submit Payment Proof</h1>
                <p class="text-muted">Enter your transaction details</p>

                <form method="POST" enctype="multipart/form-data" action="{% url 'orders:payment_submit' order.id %}" class="mt-4">
                    {% csrf_token %}
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" name="payer_name" class="form-control luxury-input" id="payer_name" value="{{ form.payer_name.value|default:order.full_name }}" required>
                                <label for="payer_name">Payer Name</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="number" name="paid_amount" class="form-control luxury-input" id="paid_amount" value="{{ form.paid_amount.value|default:order.grand_total }}" step="0.01" required>
                                <label for="paid_amount">Paid Amount (₹)</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" name="utr_number" class="form-control luxury-input" id="utr_number" placeholder="UTR" required>
                                <label for="utr_number">UTR / Transaction ID</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="datetime-local" name="payment_date" class="form-control luxury-input" id="payment_date" required>
                                <label for="payment_date">Payment Date & Time</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <input type="file" name="screenshot" class="form-control luxury-input" id="screenshot" accept="image/*">
                                <label for="screenshot">Payment Screenshot (optional)</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <textarea name="notes" class="form-control luxury-input" id="notes" rows="2" placeholder="Optional notes"></textarea>
                                <label for="notes">Additional Notes</label>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-3">
                        <a href="{% url 'orders:payment_screen' %}" class="btn-gold-outline">
                            <i class="bi bi-arrow-left"></i> Back
                        </a>
                        <button type="submit" class="btn-gold flex-grow-1">
                            Submit Proof <i class="bi bi-check-circle"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.glass-card { background: rgba(20,20,30,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,215,0,0.15); border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.gold-title { color: #d4af37; font-weight: 900; }
.text-muted { color: rgba(255,255,255,0.6) !important; }
.luxury-input { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,215,0,0.2); color: white; border-radius: 12px; padding: 12px 16px; min-height: 58px; }
.luxury-input:focus { border-color: #d4af37; box-shadow: 0 0 0 4px rgba(212,175,55,0.1); background: rgba(255,255,255,0.06); }
.form-floating label { color: rgba(255,255,255,0.5); padding: 16px 12px; }
.btn-gold { background: linear-gradient(135deg, #d4af37, #f9d976); border: none; color: #1a1a2e; font-weight: 700; padding: 14px 24px; border-radius: 50px; transition: all 0.3s ease; text-decoration: none; text-align: center; }
.btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(212,175,55,0.3); color: #1a1a2e; }
.btn-gold-outline { background: transparent; border: 2px solid #d4af37; color: #d4af37; font-weight: 600; padding: 12px 24px; border-radius: 50px; transition: all 0.3s ease; text-decoration: none; }
.btn-gold-outline:hover { background: #d4af37; color: #1a1a2e; }
</style>
{% endblock %}
