{% extends "base.html" %}{% block content %}<main class="container py-5"><h1>Support tickets</h1><form method="post" class="card p-3 mb-4">{% csrf_token %}<input class="form-control mb-2" name="subject" placeholder="Subject" required><textarea class="form-control mb-2" name="message" rows="4" placeholder="How can we help?" required></textarea><button class="btn btn-primary">Create ticket</button></form>{% for ticket in tickets %}<article class="card p-3 mb-2"><strong>{{ ticket.subject }}</strong><span class="text-muted"> · {{ ticket.get_status_display }}</span><p class="mb-0">{{ ticket.message }}</p></article>{% empty %}<p>No tickets yet.</p>{% endfor %}</main>{% endblock %}
