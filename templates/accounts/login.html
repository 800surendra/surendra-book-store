{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-xl-5">
            <div class="card bg-dark text-white border-0 shadow-lg" style="border-radius: 30px; backdrop-filter: blur(20px); background: rgba(26, 26, 46, 0.95);">
                <div class="card-body p-5">
                    <div class="text-center mb-5">
                        <div class="position-relative d-inline-block">
                            <div class="bg-gradient-primary rounded-circle p-3" style="background: linear-gradient(135deg, #6C63FF, #FF6584);">
                                <i class="bi bi-box-arrow-in-right fs-1 text-white"></i>
                            </div>
                        </div>
                        <h2 class="fw-bold mt-3">Welcome Back</h2>
                        <p class="text-muted">Login to continue your book journey</p>
                    </div>
                    
                    <form method="POST" action="{% url 'accounts:login' %}" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <div class="form-floating mb-3">
                            <input type="email" name="username" class="form-control bg-dark text-white border-secondary" id="email" placeholder="Email" required>
                            <label for="email" class="text-muted">Email Address</label>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="password" name="password" class="form-control bg-dark text-white border-secondary" id="password" placeholder="Password" required>
                            <label for="password" class="text-muted">Password</label>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="remember_me" id="remember">
                                <label class="form-check-label text-muted" for="remember">Remember Me</label>
                            </div>
                            <a href="{% url 'accounts:forgot_password' %}" class="text-primary text-decoration-none">Forgot Password?</a>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-3" style="border-radius: 50px; background: linear-gradient(135deg, #6C63FF, #FF6584); border: none; font-weight: 700; font-size: 1.1rem;">
                            <i class="bi bi-key me-2"></i>Login
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary fw-bold text-decoration-none">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-floating > .form-control:focus {
        border-color: #6C63FF;
        box-shadow: 0 0 0 0.25rem rgba(108, 99, 255, 0.25);
    }
    .form-floating > .form-control {
        border-radius: 12px;
        min-height: 58px;
    }
    .form-floating > label {
        padding: 16px 12px;
        color: #6c757d !important;
    }
    .form-control::placeholder {
        color: #6c757d;
        opacity: 0.3;
    }
    .form-check-input:checked {
        background-color: #6C63FF;
        border-color: #6C63FF;
    }
    .bg-gradient-primary {
        background: linear-gradient(135deg, #6C63FF, #FF6584);
    }
</style>
{% endblock %}
