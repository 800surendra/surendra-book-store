{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card p-4" style="border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
        <div class="text-center mb-4">
            <i class="bi bi-key display-1 text-warning"></i>
            <h2 class="fw-bold mt-2">🔑 Verify OTP</h2>
            <p class="text-muted">Enter the 6-digit OTP sent to your email</p>
        </div>
        <form method="POST" action="{% url 'accounts:verify_otp' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">OTP</label>
                <input type="text" name="otp" class="form-control form-control-lg text-center" placeholder="Enter 6-digit OTP" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-3">
                <i class="bi bi-check-circle me-2"></i>Verify OTP
            </button>
        </form>
        <p class="text-center mt-3">
            <a href="{% url 'accounts:resend_otp' %}" class="text-decoration-none">Resend OTP</a>
        </p>
    </div>
</div>
{% endblock %}
