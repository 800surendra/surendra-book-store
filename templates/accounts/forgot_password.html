{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="card bg-dark text-white border-0 shadow-lg" style="border-radius: 30px; padding: 40px;">
        <h2 class="text-center fw-bold">Forgot Password</h2>
        <p class="text-center text-muted">Enter your email to reset password</p>
        <form method="POST" action="{% url 'accounts:forgot_password' %}">
            {% csrf_token %}
            <div class="mb-3">
                <input type="email" name="email" class="form-control form-control-lg" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3" style="border-radius: 50px;">Send OTP</button>
        </form>
        <p class="text-center mt-3">
            <a href="{% url 'accounts:login' %}" class="text-decoration-none">← Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
